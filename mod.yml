title: KH1FM Equipment Stats, Abilities, LIMIT and RISK (v2.2)
originalAuthor: Raven Fang
description: >-
  One Steam Global Lua replacing Equipment Bonus v1.1 and LIMIT System v1.6.
  Gives every Keyblade and accessory editable HP, MP, STR, DEF, Fire, Ice,
  Lightning and Dark resistance, temporary Sora abilities, signed LIMIT gain,
  and signed RISK loss. V2.2 fixes character-page refreshes cancelling all
  scripted stat bonuses, repairs impossible v2/v2.1 ownership ledgers, and
  preserves v2.1 ability activation plus the existing LIMIT interfaces.
