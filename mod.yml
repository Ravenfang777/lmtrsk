title: KH1FM Equipment Stats, Abilities, LIMIT and RISK (v2.3 Loader Fix)
originalAuthor: Raven Fang
description: >-
  One Steam Global Lua replacing Equipment Bonus v1.1 and LIMIT System v1.6.
  Gives every Keyblade and accessory editable HP, MP, STR, DEF, Fire, Ice,
  Lightning and Dark resistance, temporary Sora abilities, signed LIMIT gain,
  and signed RISK loss. V2.3 preserves the v2.2 stat-refresh and ability fixes,
  and corrects the edited Oathkeeper row that prevented LuaEngine from loading
  the controller at all.
