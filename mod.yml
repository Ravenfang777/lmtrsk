title: KH1FM Equipment Stats, Abilities, LIMIT and RISK (v2)
originalAuthor: Raven Fang
description: >-
  One Steam Global Lua replacing Equipment Bonus v1.1 and LIMIT System v1.6.
  Gives every Keyblade and accessory editable HP, MP, STR, DEF, Fire, Ice,
  Lightning and Dark resistance, temporary Sora abilities, signed LIMIT gain,
  and signed RISK loss. Gear effects stack per equipped copy and are restored
  through an ownership ledger when the gear is removed. Preserves the v1.6
  LIMIT interface for the existing custom HUD and EnemyConfig companion.
game: kh1
